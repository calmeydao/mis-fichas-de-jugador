<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Personal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            padding: 20px;
            text-align: center;
        }
        .card img {
            border-radius: 50%;
            width: 100px;
            height: 100px;
        }
        .card h2 {
            margin: 10px 0;
        }
        .card p {
            color: #777;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/100" alt="Foto de perfil">
        <h2>Juan Pérez</h2>
        <p>Edad: 30</p>
        <p>Correo: juan.perez@example.com</p>
        <p>Teléfono: +34 600 123 456</p>
        <p>Dirección: Calle Falsa 123, Ciudad, País</p>
    </div>
</body>
</html>
